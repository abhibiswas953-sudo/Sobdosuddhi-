name: Build Sobdosuddhi 1.0 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Debug & Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: sobdosuddhi-1.0-android-apks
          path: |
            android_app/build/app/outputs/flutter-apk/app-debug.apk
            android_app/build/app/outputs/flutter-apk/app-release.apk
