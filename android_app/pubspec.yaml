publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.2
  file_picker: ^8.1.4
  shared_preferences: ^2.3.3
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0
  pdf: ^3.11.1
  printing: ^5.13.4
